# YOLO 训练、验证、预测和导出的全局配置 YAML，包含设置和超参数
# 文档参见 https://docs.ultralytics.com/usage/cfg/

task: detect # (str) YOLO 任务，即 detect、segment、classify、pose、obb
mode: train # (str) YOLO 模式，即 train、val、predict、export、track、benchmark

# 训练设置 -------------------------------------------------------------------------------------------------------------
model: # (str, optional) 模型文件路径，例如 yolov8n.pt 或 yolov8n.yaml
data: # (str, optional) 数据文件路径，例如 coco8.yaml
epochs: 10 # (int) 训练轮数
time: # (float, optional) 最长训练小时数；设置后覆盖 epochs
patience: 100 # (int) 验证指标连续 N 轮未提升后早停
batch: 8 # (int | float) 批次大小；整数如 16，或 0.0–1.0 的浮点数表示 AutoBatch 占 GPU 显存比例
imgsz: [640, 640] # (int | list) 训练/验证使用整数（方形）；预测/导出可使用 [h,w]
save: True # (bool) 保存训练检查点和预测结果
save_period: -1 # (int) 每 N 轮保存一次检查点；小于 1 时禁用
cache: False # (bool | str) 将图像缓存到内存（True/'ram'）或磁盘（'disk'）以加速数据加载；False 禁用
device: # (int | str | list) 设备：CUDA 用 0 或 [0,1,2,3]，'cpu'/'mps'，或 -1/[-1,-1] 自动选择空闲 GPU
workers: 4 # (int) 数据加载器工作进程数（DDP 时每个 RANK）
project: # (str, optional) 结果根目录的项目名称
name: # (str, optional) 实验名称；结果保存在 'project/name'
exist_ok: False # (bool) 为 True 时覆盖已存在的 'project/name'
pretrained: True # (bool | str) 使用预训练权重（bool）或从路径加载权重（str）
optimizer: MuSGD # (str) 优化器：SGD、MuSGD、Adam、Adamax、AdamW、NAdam、RAdam、RMSProp 或 auto
verbose: True # (bool) 训练/验证时打印详细日志
seed: 0 # (int) 用于复现的随机种子
deterministic: True # (bool) 启用确定性操作；可复现但可能更慢
single_cls: False # (bool) 将所有类别视为单一类别
rect: False # (bool) 训练使用矩形批次；mode='val' 时验证使用矩形批处理
cos_lr: True # (bool) 余弦学习率调度器
close_mosaic: 10 # (int) 最后 N 轮禁用 mosaic 增强（0 表示保持启用）
resume: False # (bool) 从运行目录中的最后一个检查点恢复训练
amp: True # (bool) 自动混合精度（AMP）训练；True 会运行 AMP 能力检查
fraction: 1.0 # (float) 使用的训练数据集比例（1.0 = 全部）
profile: False # (bool) 训练时对 ONNX/TensorRT 速度进行分析以供日志记录
freeze: # (int | list, optional) 冻结前 N 层（int）或指定层索引（list）
multi_scale: 0.0 # (float) 多尺度范围，作为 imgsz 的比例；尺寸会舍入到 stride 的倍数
compile: False # (bool | str) 启用 torch.compile() backend='inductor'；True="default"，False=关闭，或 "default|reduce-overhead|max-autotune-no-cudagraphs"

# 分割
overlap_mask: True # (bool) 训练时将实例掩码合并为一个掩码（仅分割）
mask_ratio: 4 # (int) 掩码下采样比例（仅分割）

# 分类
dropout: 0.0 # (float) 分类头的 dropout（仅分类）

# 验证/测试设置 --------------------------------------------------------------------------------------------------------
val: True # (bool) 训练期间运行验证/测试
split: val # (str) 要评估的数据集划分：'val'、'test' 或 'train'
save_json: False # (bool) 将结果保存为 COCO JSON 以供外部评估
conf: # (float, optional) 置信度阈值；默认：predict=0.25，val=0.001
iou: 0.7 # (float) 用于 NMS 的 IoU 阈值
max_det: 300 # (int) 每张图像的最大检测数
half: False # (bool) 如果支持，使用半精度（FP16）
dnn: False # (bool) 使用 OpenCV DNN 进行 ONNX 推理
plots: True # (bool) 训练/验证期间保存图表和图像
end2end: # (bool, optional) 预测/验证/导出时是否使用 end2end 头（YOLO26、YOLOv10）

# 预测设置 -------------------------------------------------------------------------------------------------------------
source: # (str, optional) 图像或视频的路径/目录/URL/流；例如 'ultralytics/assets' 或 '0' 表示摄像头
vid_stride: 1 # (int) 视频源每 N 帧读取一帧
stream_buffer: False # (bool) True 缓冲所有帧；False 保留最新帧以降低流延迟
visualize: False # (bool) 可视化模型特征（predict）或 TP/FP/FN 混淆（val）
augment: False # (bool) 预测时应用测试时增强
agnostic_nms: False # (bool) 类别无关 NMS
classes: # (int | list[int], optional) 按类别 id 过滤，例如 0 或 [0,2,3]
retina_masks: False # (bool) 使用高分辨率分割掩码（segment）
embed: # (list[int], optional) 从指定层索引返回特征嵌入

# 可视化设置 -----------------------------------------------------------------------------------------------------------
show: False # (bool) 如果支持，在窗口中显示图像/视频
save_frames: False # (bool) 保存视频预测的单独帧
save_txt: False # (bool) 将结果保存为 .txt 文件（xywh 格式）
save_conf: False # (bool) 随结果保存置信度分数
save_crop: False # (bool) 将裁剪的预测区域保存到文件
show_labels: True # (bool) 在图像上绘制类别标签，例如 'person'
show_conf: True # (bool) 在图像上绘制置信度值，例如 '0.99'
show_boxes: True # (bool) 在图像上绘制边界框
line_width: # (int, optional) 框线宽；未设置时随图像大小自动缩放

# 导出设置 -------------------------------------------------------------------------------------------------------------
format: torchscript # (str) 目标格式，例如 torchscript|onnx|openvino|engine|coreml|saved_model|pb|tflite|edgetpu|tfjs|paddle|mnn|ncnn|imx|rknn|executorch|axelera
keras: False # (bool) 仅 TF SavedModel（format=saved_model）；导出时启用 Keras 层
optimize: False # (bool) 仅 TorchScript；对脚本化模型应用移动端优化
int8: False # (bool) 在支持的格式上使用 INT8/PTQ（openvino、engine、coreml、tflite、tfjs、mnn、imx、axelera）；需要校准数据/比例
dynamic: False # (bool) 为 torchscript、onnx、openvino、engine、coreml 使用动态形状；启用可变图像尺寸
simplify: True # (bool) 仅 ONNX/engine；在运行时转换前运行图简化器以获得更简洁的 ONNX
opset: # (int, optional) 仅 ONNX/engine；导出的 opset 版本；留空使用经过测试的默认值
workspace: # (float, optional) 仅 engine（TensorRT）；工作空间大小，单位为 GiB，例如 4
nms: False # (bool) 后端支持时将 NMS 融合到导出模型；如果为 True，则应用 conf/iou（agnostic_nms 在 coreml 上除外）

# 超参数 ---------------------------------------------------------------------------------------------------------------
lr0: 0.01 # (float) 初始学习率（SGD=1e-2，Adam/AdamW=1e-3）
lrf: 0.0002 # (float) 最终学习率比例；最终学习率 = lr0 * lrf
momentum: 0.937 # (float) SGD 动量或 Adam beta1
weight_decay: 0.0005 # (float) 权重衰减（L2 正则化）
warmup_epochs: 3.0 # (float) 预热轮数（允许小数）
warmup_momentum: 0.8 # (float) 预热期间的初始动量
warmup_bias_lr: 0.1 # (float) 预热期间的偏置学习率
box: 7.5 # (float) 边界框损失增益
cls: 1.5 # (float) 分类损失增益
cls_pw: 0.0 # (float) 用于处理类别不平衡的类别权重幂（0.0=禁用，1.0=完全逆频率）
dfl: 1.5 # (float) 分布焦点损失增益
pose: 12.0 # (float) 姿态损失增益（pose 任务）
kobj: 1.0 # (float) 关键点目标性损失增益（pose 任务）
rle: 1.0 # (float) RLE 损失增益（pose 任务）
angle: 1.0 # (float) 有向角度损失增益（obb 任务）
nbs: 64 # (int) 用于损失归一化的名义批次大小
hsv_h: 0.015 # (float) HSV 色调增强比例
hsv_s: 0.7 # (float) HSV 饱和度增强比例
hsv_v: 0.4 # (float) HSV 明度（亮度）增强比例
degrees: 15.0 # (float) 旋转角度（+/-）
translate: 0.1 # (float) 平移比例（+/-）
scale: 0.5 # (float) 缩放增益（+/-）
shear: 0.0 # (float) 剪切角度（+/-）
perspective: 0.0001 # (float) 透视比例（通常 0–0.001）
flipud: 0.0 # (float) 垂直翻转概率
fliplr: 0.0 # (float) 水平翻转概率
bgr: 0.0 # (float) RGB↔BGR 通道交换概率
mosaic: 1.0 # (float) mosaic 增强概率
mixup: 0.0 # (float) MixUp 增强概率
cutmix: 0.0 # (float) CutMix 增强概率
copy_paste: 0.0 # (float) 分割复制粘贴概率
copy_paste_mode: flip # (str) 分割的复制粘贴策略：flip 或 mixup
auto_augment: randaugment # (str) 分类自动增强策略：randaugment、autoaugment、augmix
erasing: 0.4 # (float) 分类随机擦除概率（0.0–1.0）

# 自定义 config.yaml ---------------------------------------------------------------------------------------------------
cfg: # (str, optional) 覆盖默认值的 config.yaml 路径

# 跟踪器设置 -----------------------------------------------------------------------------------------------------------
tracker: botsort.yaml # (str) 跟踪器配置文件：botsort.yaml 或 bytetrack.yaml
